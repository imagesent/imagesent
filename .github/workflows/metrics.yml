name: Metrics

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build activity pulse
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_USER: imagesent
          PULSE_TZ_HOURS: "8"
        run: python3 .github/scripts/pulse.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.activity.svg
          git diff --cached --quiet || (git commit -m "Update metrics.activity.svg" && git push)
