<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="yuziro, multi-language tinkerer, lv.17" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="300" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.25" stop-color="#9b5de5"/>
      <stop offset="0.5" stop-color="#f15bb5"/>
      <stop offset="0.75" stop-color="#fee440"/>
      <stop offset="1" stop-color="#00bbf9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 500 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1a"/>
      <stop offset="1" stop-color="#1a1436"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f15bb5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f15bb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle cx="840" cy="40" r="260" fill="url(#glowA)"/>
    <circle cx="60" cy="300" r="240" fill="url(#glowB)"/>
    <rect width="1000" height="300" fill="url(#scan)"/>
    <rect x="-300" y="-20" width="220" height="340" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1200" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="3" y="3" width="994" height="294" rx="16" fill="none" stroke="url(#foil)" stroke-width="3"/>

  <!-- left: identity -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,Menlo,monospace">
    <text x="60" y="68" font-size="14" fill="#8d86b3" letter-spacing="5">// PLAYER CARD</text>
    <text x="56" y="160" font-size="92" font-weight="bold" fill="url(#foil)" letter-spacing="-2">yuziro</text>
    <text x="60" y="203" font-size="20" fill="#d9d4ff">i like girls, not dudes <tspan fill="#8d86b3">·</tspan> 19 years old</text>

    <g font-size="14" font-weight="bold" fill="#0d0b1a">
      <rect x="60" y="226" width="100" height="32" rx="16" fill="url(#foil)"/>
      <text x="110" y="247" text-anchor="middle">Valorant</text>
      <rect x="172" y="226" width="88" height="32" rx="16" fill="url(#foil)"/>
      <text x="216" y="247" text-anchor="middle">Roblox</text>
      <rect x="272" y="226" width="108" height="32" rx="16" fill="url(#foil)"/>
      <text x="326" y="247" text-anchor="middle">Minecraft</text>
    </g>
  </g>

  <!-- right: stats panel -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,Menlo,monospace">
    <rect x="620" y="36" width="320" height="228" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="url(#foil)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="646" y="68" font-size="12" fill="#8d86b3" letter-spacing="4">// STATS</text>

    <g font-size="14" fill="#d9d4ff">
      <text x="646" y="108">PYTHON</text>
      <rect x="742" y="96" width="172" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="742" y="96" width="0" height="12" rx="6" fill="url(#foil)"><animate attributeName="width" from="0" to="150" dur="1.6s" fill="freeze"/></rect>

      <text x="646" y="146">LUA</text>
      <rect x="742" y="134" width="172" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="742" y="134" width="0" height="12" rx="6" fill="url(#foil)"><animate attributeName="width" from="0" to="130" dur="1.8s" fill="freeze"/></rect>

      <text x="646" y="184">TS</text>
      <rect x="742" y="172" width="172" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="742" y="172" width="0" height="12" rx="6" fill="url(#foil)"><animate attributeName="width" from="0" to="112" dur="2s" fill="freeze"/></rect>

      <text x="646" y="222">RUST</text>
      <rect x="742" y="210" width="172" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="742" y="210" width="0" height="12" rx="6" fill="url(#foil)"><animate attributeName="width" from="0" to="56" dur="2.2s" fill="freeze"/></rect>
    </g>

    <text x="646" y="250" font-size="11" fill="#8d86b3">rust.exe loading<tspan>...<animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
