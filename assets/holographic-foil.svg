<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="yuziro, multi-language tinkerer, lv.17" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="300" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.25" stop-color="#9b5de5"/>
      <stop offset="0.5" stop-color="#f15bb5"/>
      <stop offset="0.75" stop-color="#fee440"/>
      <stop offset="1" stop-color="#00bbf9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 500 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1a"/>
      <stop offset="1" stop-color="#171230"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#scan)"/>
  <rect x="3" y="3" width="994" height="294" rx="16" fill="none" stroke="url(#foil)" stroke-width="3"/>

  <!-- shimmer sweep -->
  <rect x="-200" y="0" width="120" height="300" fill="#ffffff" opacity="0.07" transform="skewX(-20)">
    <animate attributeName="x" values="-200;1100" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="70" font-family="Courier New, monospace" font-size="18" fill="#8d86b3" letter-spacing="4">// PLAYER CARD</text>
  <text x="60" y="170" font-family="Courier New, monospace" font-size="96" font-weight="bold" fill="url(#foil)">yuziro</text>
  <text x="62" y="212" font-family="Courier New, monospace" font-size="24" fill="#d9d4ff">multi-language tinkerer · lv.17</text>

  <g font-family="Courier New, monospace" font-size="16" fill="#0d0b1a" font-weight="bold">
    <rect x="60" y="238" width="104" height="30" rx="15" fill="url(#foil)"/>
    <text x="112" y="258" text-anchor="middle">Valorant</text>
    <rect x="176" y="238" width="96" height="30" rx="15" fill="url(#foil)"/>
    <text x="224" y="258" text-anchor="middle">Roblox</text>
    <rect x="284" y="238" width="112" height="30" rx="15" fill="url(#foil)"/>
    <text x="340" y="258" text-anchor="middle">Minecraft</text>
  </g>

  <!-- decorative corner glyph -->
  <g transform="translate(820 150)" fill="none" stroke="url(#foil)" stroke-width="3" opacity="0.9">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
    <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" opacity="0.6"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="40s" repeatCount="indefinite"/>
  </g>
</svg>
