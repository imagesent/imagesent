<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="yuziro terminal session">
  <defs>
    <linearGradient id="foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="300" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5d4"/><stop offset="0.3" stop-color="#9b5de5"/>
      <stop offset="0.6" stop-color="#f15bb5"/><stop offset="1" stop-color="#fee440"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 500 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c0"><rect x="40" y="66" width="0" height="34">
      <animate attributeName="width" values="0;0;100;100;0" keyTimes="0;0.0312;0.0750;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="40" y="101" width="0" height="34">
      <animate attributeName="width" values="0;0;76;76;0" keyTimes="0;0.1000;0.1250;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="40" y="151" width="0" height="34">
      <animate attributeName="width" values="0;0;196;196;0" keyTimes="0;0.1625;0.2313;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="40" y="186" width="0" height="34">
      <animate attributeName="width" values="0;0;136;136;0" keyTimes="0;0.2500;0.2875;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="40" y="236" width="0" height="34">
      <animate attributeName="width" values="0;0;172;172;0" keyTimes="0;0.3500;0.4062;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="40" y="271" width="0" height="34">
      <animate attributeName="width" values="0;0;292;292;0" keyTimes="0;0.4313;0.4625;0.95;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1000" height="340" rx="14" fill="#0d0b1a"/>
  <rect x="2" y="2" width="996" height="336" rx="13" fill="none" stroke="url(#foil)" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="40" rx="13" fill="#171230"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/><circle cx="50" cy="22" r="6" fill="#ffbd2e"/><circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="500" y="27" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#8d86b3">yuziro@home: ~</text>
  <text x="40" y="90" clip-path="url(#c0)" font-family="Courier New, monospace" font-size="20" font-weight="normal" fill="#d9d4ff" xml:space="preserve">$ whoami</text>
  <text x="40" y="125" clip-path="url(#c1)" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="url(#foil)" xml:space="preserve">a chud</text>
  <text x="40" y="175" clip-path="url(#c2)" font-family="Courier New, monospace" font-size="20" font-weight="normal" fill="#d9d4ff" xml:space="preserve">$ ls ~/languages</text>
  <text x="40" y="210" clip-path="url(#c3)" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="url(#foil)" xml:space="preserve">shown below</text>
  <text x="40" y="260" clip-path="url(#c4)" font-family="Courier New, monospace" font-size="20" font-weight="normal" fill="#d9d4ff" xml:space="preserve">$ ./play --now</text>
  <text x="40" y="295" clip-path="url(#c5)" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="url(#foil)" xml:space="preserve">valorant • roblox • mlbb</text>
  <rect x="332" y="277" width="11" height="22" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
